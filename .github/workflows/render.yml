name: Render Kindle screen
on:
  schedule:
    - cron: "*/30 * * * *"
    # extra attempts right after each slot boundary (06/12/18/24 Madrid = 04/05, 10/11, 16/17, 22/23 UTC):
    # GitHub often drops or delays scheduled runs, so several chances are needed
    - cron: "3,13,23,33,43,53 4,5,10,11,16,17,22,23 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-liberation
      - run: pip install -r requirements.txt
      - name: Render
        env:
          KINDLE_CONFIG: ${{ secrets.KINDLE_CONFIG }}
        run: |
          mkdir -p site
          python render.py "site/${{ vars.IMAGE_NAME || 'screen.png' }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
